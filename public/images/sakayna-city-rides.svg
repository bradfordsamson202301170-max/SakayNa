<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="420" rx="24" fill="url(#bg2)"/>

  <!-- Soft map grid lines -->
  <g stroke="#CBD5E1" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
  </g>

  <!-- Sweeping 3D-style elevated road ribbon -->
  <path d="M-20 350 C140 310 150 110 310 120 C460 130 430 280 620 220" stroke="url(#curve)" stroke-width="64" stroke-linecap="round" fill="none"/>
  <path d="M-20 350 C140 310 150 110 310 120 C460 130 430 280 620 220" stroke="#F97316" stroke-width="6" stroke-dasharray="18 14" stroke-linecap="round" fill="none"/>

  <!-- Pickup Pin -->
  <g transform="translate(125, 250)">
    <circle cx="0" cy="0" r="24" fill="#F97316" opacity="0.22"/>
    <circle cx="0" cy="0" r="14" fill="#F97316" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Destination Pin -->
  <g transform="translate(490, 235)">
    <circle cx="0" cy="0" r="24" fill="#059669" opacity="0.22"/>
    <circle cx="0" cy="0" r="14" fill="#059669" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Center Scooter Badge -->
  <g transform="translate(260, 72)">
    <circle cx="42" cy="42" r="42" fill="#F97316"/>
    <circle cx="42" cy="42" r="34" fill="#0B132B"/>
    <path d="M24 50 C29 38 38 30 55 27 L49 38 H59 L32 56 L37 44 H27 L24 50 Z" fill="#FFFFFF"/>
  </g>
</svg>
